<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vendor Dashboard | MessBuddy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="vendor-dashboard.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">MP</span>
        <div>
          <h1>Vendor Dashboard</h1>
          <p>Publish your daily menu for students</p>
        </div>
      </div>
      <div class="top-actions">
        <span id="storageMode" class="storage-pill">Storage: checking...</span>
        <a href="profile.html?role=vendor" class="ghost-link">Profile</a>
        <button id="logoutBtn" type="button" class="danger-btn">Logout</button>
      </div>
    </header>

    <main class="layout">
      <section class="panel form-panel">
        <h2 id="formTitle">Create Daily Menu Card</h2>
        <p class="muted">One card per mess per day (you can edit anytime).</p>
        <div id="messSetup" class="mess-setup">
          <label>
            Mess Name (set once)
            <input id="messPropertyName" type="text" placeholder="e.g. Spice Hub Mess" />
          </label>
          <div class="form-actions">
            <button id="saveMessNameBtn" type="button" class="primary-btn">Save Mess Name</button>
          </div>
          <p id="messSetupMessage" class="message" role="status" aria-live="polite"></p>
        </div>
        <p id="messIdentity" class="mess-identity"></p>
        <form id="vendorMenuForm" novalidate>
          <input type="hidden" id="menuId" />

          <div class="grid-2">
            <label>
              Tier
              <select id="tier" required>
                <option value="UNLIMITED">UNLIMITED</option>
                <option value="LIMITED">LIMITED</option>
                <option value="PRO-REACH">PRO-REACH</option>
              </select>
            </label>
            <label>
              Menu Date
              <input id="menuDate" type="date" required />
            </label>
          </div>

          <div class="grid-2">
            <label>
              Price (INR)
              <input id="price" type="number" min="1" step="1" placeholder="90" required />
            </label>
            <div></div>
          </div>

          <label>
            Timings
            <input id="timings" type="text" placeholder="12:00 PM - 3:00 PM" required />
          </label>

          <div class="grid-2">
            <label>
              Crowd Level
              <input id="crowd" type="text" placeholder="Low wait" required />
            </label>
            <label>
              Address
              <input id="distance" type="text" placeholder="Hostel Block A, Campus Circle, Pune" required />
            </label>
          </div>

          <label>
            Coordinates
            <input id="messCoords" type="text" placeholder="18.5204,73.8567" />
          </label>
          <div class="map-tools">
            <button id="useCurrentLocationBtn" type="button" class="ghost-btn">Use Current Location</button>
            <button id="openMapsBtn" type="button" class="ghost-btn">Open Map Picker</button>
            <button id="findAddressBtn" type="button" class="ghost-btn">Find Address</button>
            <button id="setMapLocationBtn" type="button" class="ghost-btn">Set Selected Location</button>
          </div>
          <div id="vendorLocationMap" class="vendor-location-map" aria-label="Location picker map"></div>
          <label>
            Map Link (optional)
            <input id="mapsLink" type="url" placeholder="Paste Google Maps or OpenStreetMap link here" />
          </label>
          <p id="mapMessage" class="message" role="status" aria-live="polite"></p>
          <iframe
            id="vendorMapPreview"
            class="vendor-map-preview"
            title="Vendor location preview"
            loading="lazy"
            referrerpolicy="no-referrer-when-downgrade"
          ></iframe>

          <label>
            Menu Items (one per line)
            <textarea id="menuItems" rows="5" placeholder="Dal Tadka&#10;4 Roti&#10;Jeera Rice" required></textarea>
          </label>

          <label>
            Special Dish
            <input id="special" type="text" placeholder="Moong Dal Halwa" required />
          </label>

          <label class="check-row">
            <input id="vegetarianOnly" type="checkbox" />
            <span>Vegetarian only</span>
          </label>

          <p id="formMessage" class="message" role="status" aria-live="polite"></p>

          <div class="form-actions">
            <button id="submitBtn" type="submit" class="primary-btn">Save Menu Card</button>
            <button id="resetBtn" type="button" class="ghost-btn">Clear</button>
          </div>
        </form>
      </section>

      <section class="panel list-panel">
        <div class="list-header">
          <div>
            <h2>Your Daily Cards</h2>
            <p class="muted">Edit or delete your published menus.</p>
          </div>
          <button id="refreshBtn" type="button" class="ghost-btn">Refresh</button>
        </div>
        <div id="vendorCards" class="cards"></div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="menu-data.js"></script>
    <script src="vendor-dashboard.js"></script>
  </body>
</html>
