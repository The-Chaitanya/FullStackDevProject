<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vendor Dashboard | Coming Soon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg1: #fff8ef;
        --bg2: #f7eee3;
        --ink: #222;
        --accent: #e1583a;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Poppins", sans-serif;
        color: var(--ink);
        background: radial-gradient(circle at top, var(--bg1), var(--bg2));
        padding: 20px;
      }
      .card {
        width: min(700px, 96vw);
        background: #fff;
        border: 1px solid #f0d8c7;
        border-radius: 18px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
        padding: 28px;
        text-align: center;
      }
      h1 { margin: 0 0 10px; font-size: clamp(1.5rem, 3vw, 2rem); }
      p { margin: 8px 0; color: #4a4a4a; }
      .actions { margin-top: 18px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
      a {
        text-decoration: none;
        padding: 10px 16px;
        border-radius: 999px;
        font-weight: 600;
      }
      .primary { background: var(--accent); color: #fff; }
      .ghost { border: 1px solid #e5b29f; color: #7a321f; background: #fff; }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Vendor Dashboard Coming Soon</h1>
      <p>Your vendor panel is not built yet.</p>
      <p>Login is working and vendors are now routed here correctly.</p>
      <div class="actions">
        <a class="ghost" href="welcome.html">Back to Welcome</a>
        <a class="primary" href="login.html">Back to Login</a>
      </div>
    </main>
  </body>
</html>
